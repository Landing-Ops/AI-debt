<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 진단 결과 · 개인회생 신청 대상 확인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./css/brand.css">
<link rel="stylesheet" href="./css/typography.css">
<link rel="stylesheet" href="./css/common.css">
<link rel="stylesheet" href="./css/premium.css">
<style>
  /* reject 페이지 전용 레이아웃 (Tailwind 미사용 — 순수 CSS) */
  .rjp{ width:min(var(--frame-w,420px),100vw); margin-inline:auto;
        min-height:100dvh; display:flex; flex-direction:column;
        padding:26px 20px;
        background:var(--section-alt-bg,#eef4fc); background-image:var(--grad-tint); }
  .rjp__top{ display:flex; justify-content:flex-end; margin-bottom:6px; }
  .rjp__eyebrow{ margin:0; font-size:15px; color:var(--neutral-500); font-weight:500; }
  .rjp__title{ margin:2px 0 0; font-size:26px; font-weight:800; color:var(--neutral-900); letter-spacing:-.01em; }
  .rjp__card{ margin-top:22px; padding:30px 22px;
              border-radius:var(--radius-2xl,20px); background:#fff;
              box-shadow:var(--shadow-card,0 6px 18px rgba(12,68,124,.08)); text-align:center; }
  .rjp__face{ display:flex; justify-content:center; }
  .rjp__face img{ width:100px; height:100px; object-fit:contain; }
  .rjp__cardtitle{ margin:18px 0 0; font-size:21px; font-weight:800; color:var(--neutral-900); }
  .rjp__gauge{ position:relative; height:8px; margin:22px 2px 6px; border-radius:999px;
               background:linear-gradient(90deg,#e05656,#e8b04b 55%,#1D9E75); }
  .rjp__marker{ position:absolute; top:50%; left:8%; width:16px; height:16px;
                transform:translate(-50%,-50%); border-radius:50%;
                background:#e05656; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .rjp__labels{ display:flex; justify-content:space-between; padding:0 2px;
                font-size:12px; color:var(--neutral-400); font-weight:500; }
  .rjp__msg{ margin-top:22px; padding:16px; text-align:left;
             border-radius:var(--radius-lg,13px); background:var(--bg-tint,#eef4fc); }
  .rjp__msgtitle{ margin:0 0 12px; font-size:14px; font-weight:700; text-align:center; color:var(--neutral-700); }
  .rjp__reasons{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
  .rjp__reasons li{ display:flex; align-items:flex-start; gap:8px; font-size:13.5px; color:var(--neutral-600); line-height:1.5; }
  .rjp__bullet{ flex:0 0 5px; width:5px; height:5px; margin-top:7px; border-radius:50%; background:var(--primary-bright,#0b5bd3); }
  .rjp__foot{ margin-top:auto; padding-top:20px; }
  .rjp__cta{ display:block; width:100%; padding:17px; box-sizing:border-box;
             border:none; border-radius:14px; text-align:center; text-decoration:none;
             background:var(--color-cta-main,#0b5bd3); color:#fff; font-size:18px; font-weight:700;
             box-shadow:var(--shadow-cta,0 8px 18px rgba(11,91,211,.28)); cursor:pointer; }
  .rjp__iconbtn{ display:inline-flex; align-items:center; justify-content:center;
                 width:38px; height:38px; border-radius:50%; color:var(--neutral-400);
                 text-decoration:none; }
</style>
</head>
<body>

<main class="rjp">
  <div class="rjp__top">
    <a href="./index.html" class="rjp__iconbtn" aria-label="닫기"><i class="ti ti-x" aria-hidden="true"></i></a>
  </div>

  <div>
    <p class="rjp__eyebrow">고객님의</p>
    <p class="rjp__title">AI 진단 결과입니다</p>
  </div>

  <div class="rjp__card">
    <div class="rjp__face"><img src="./img/reject-01.png" alt=""></div>
    <h2 class="rjp__cardtitle">개인회생 예상 탕감률<br>조회가 불가능합니다</h2>
    <div class="rjp__gauge"><div class="rjp__marker"></div></div>
    <div class="rjp__labels"><span>불가능</span><span>가능</span></div>

    <div class="rjp__msg">
      <p class="rjp__msgtitle">다음의 경우 신청 대상에서 제외돼요</p>
      <ul class="rjp__reasons">
        <li><span class="rjp__bullet"></span>최근 5년 내 법원에서 면책받은 경우</li>
        <li><span class="rjp__bullet"></span>담보대출·체납 세금만 있는 경우</li>
        <li><span class="rjp__bullet"></span>총 채무가 2,000만원 미만인 경우</li>
        <li><span class="rjp__bullet"></span>재산이 채무보다 많은 경우</li>
        <li><span class="rjp__bullet"></span>총 채무가 15억원을 초과하는 경우</li>
      </ul>
    </div>
  </div>

  <div class="rjp__foot">
    <a class="rjp__cta" href="./diagnosis.html" role="button">다시 진단하기</a>
  </div>
</main>

</body>
</html>
